[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-aiops"
version = "0.1.0"
description = "Evidence-first Agentic AIOps reference implementation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ben Lee" }]
keywords = ["aiops", "sre", "kubernetes", "temporal", "incident-response", "agent-infrastructure"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Experimental LAB-only CUDA capture dependencies, not an environment lock.
# An issuer-verified model/runtime and production training gate are not supplied.
capture = ["torch>=2.6,<3", "transformers>=4.55,<5"]
temporal = ["cloud-agent-runtime[temporal]>=0.1.0"]

[project.scripts]
agentic-aiops = "agentic_aiops.cli:main"
golden-approval = "agentic_aiops.approval_cli:main"
agent-stack-lock = "agentic_aiops.stack_lock:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_aiops"]
