[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-aiops"
version = "0.1.0"
description = "Evidence-first Agentic AIOps reference implementation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ben Lee" }]
keywords = ["aiops", "sre", "kubernetes", "temporal", "incident-response", "agent-infrastructure"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional; not imported by the default read-only SRE runtime.
# This is an API compatibility range, not a hash-locked training environment.
train = ["torch>=2.6,<3", "trl>=0.25,<0.26", "peft>=0.17,<1",
         "transformers>=4.55,<5", "datasets>=3,<5", "accelerate>=1,<2"]
temporal = ["cloud-agent-runtime[temporal]>=0.1.0"]

[project.scripts]
agentic-aiops = "agentic_aiops.cli:main"
golden-approval = "agentic_aiops.approval_cli:main"
agent-stack-lock = "agentic_aiops.stack_lock:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_aiops"]
