name: go-endpoint-kind

on:
  workflow_dispatch:
  # A merged development baseline is not evidence until the exact main commit
  # has also passed the live disposable-kind incident.
  push:
    branches: [main]
  # Fallback for bot/app-created commits that may not emit workflow-triggering
  # push events. Scheduled workflows run the latest default-branch commit.
  schedule:
    - cron: '43 4 * * *'
  pull_request:
    paths:
      - "internal/**"
      - "cmd/sre-agent/**"
      - "go.mod"
      - "demo/go-endpoint/**"
      - ".github/workflows/go-endpoint-kind.yml"

permissions:
  contents: read

jobs:
  endpoint-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact event commit before live proof
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: golden-endpoint
      - name: Run real EndpointSlice no-ready and healthy-control incidents
        run: bash demo/go-endpoint/run-kind.sh
      - name: Preserve original fault and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-endpoint-kind-proof-${{ github.sha }}
          path: /tmp/go-endpoint-proof/
          if-no-files-found: error

  # A success receipt must be verifiable after crossing the artifact boundary,
  # not only in the live runner's local /tmp directory.
  artifact-roundtrip:
    needs: endpoint-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin verifier to the proof-producing commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Retrieve uploaded evidence
        uses: actions/download-artifact@v4
        with:
          name: go-endpoint-kind-proof-${{ github.sha }}
          path: ${{ runner.temp }}/endpoint-proof
      - name: Verify downloaded artifact against frozen manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/endpoint-proof/incident-manifest.json"
          python3 demo/go-endpoint/incident_manifest.py verify "$RUNNER_TEMP/endpoint-proof"
