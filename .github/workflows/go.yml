name: go-contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go unit tests with race detector
        run: go test -race ./...
      - name: Go static analysis
        run: go vet ./...
      - name: Build Go CLI
        run: go build ./cmd/sre-agent
      - name: Prove legacy benchmark readability
        run: go run ./cmd/sre-agent verify-bundle --scenario --file benchmarks/scenarios/checkout-latency.json
