name: go-contracts

on:
  pull_request:
  push:
    branches: [main]
  # Exercise the latest default-branch tree even when a push event is absent.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact-commit Go race/vet/build/bundle and evidence
        run: |
          python scripts/verify_exact_tree.py \
            --repo . --expected-sha "${{ github.sha }}" \
            --scope go --out-dir "${{ runner.temp }}/sre-exact-go"
      - name: Upload exact-commit Go proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-exact-go-${{ github.sha }}
          path: ${{ runner.temp }}/sre-exact-go/
          if-no-files-found: warn
