name: go-readonly-kind

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmd/sre-agent/**"
      - "internal/observe/**"
      - "internal/evidence/**"
      - "demo/k8s/**"
      - "demo/go-observe/**"
      - "docs/go-readonly-golden.md"
      - ".github/workflows/go-readonly-kind.yml"

permissions:
  contents: read

jobs:
  readonly-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: golden-aiops
      - name: Deploy disposable checkout and reader
        run: |
          kubectl apply -f demo/k8s/golden-stack.yaml
          kubectl apply -f demo/go-observe/sre-agent-readonly-rbac.yaml
          kubectl -n golden-demo rollout status deploy/checkout-api --timeout=180s
          kubectl -n golden-demo rollout status deploy/prometheus --timeout=180s
      - name: Prove least privilege
        run: |
          set -euo pipefail
          SA=system:serviceaccount:golden-demo:sre-agent-reader
          test "$(kubectl auth can-i get deployments --as="$SA" -n golden-demo)" = yes
          test "$(kubectl auth can-i list pods --as="$SA" -n golden-demo)" = yes
          test "$(kubectl auth can-i patch deployments/scale --as="$SA" -n golden-demo)" = no
          test "$(kubectl auth can-i get secrets --as="$SA" -n golden-demo)" = no
      - name: Collect live evidence using reader bearer token
        run: |
          set -euo pipefail
          kubectl -n golden-demo port-forward svc/prometheus 19090:9090 >/tmp/sre-prometheus-pf.log 2>&1 &
          PF=$!
          trap 'kill $PF || true; rm -f /tmp/sre-agent-reader.token' EXIT
          kubectl -n golden-demo create token sre-agent-reader --duration=10m >/tmp/sre-agent-reader.token
          chmod 0600 /tmp/sre-agent-reader.token
          kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > /tmp/sre-agent-ca.pem
          KUBE_API="$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:19090/api/v1/query?query=max(checkout_request_latency_seconds)' | grep -q '"value"'; then break; fi
            sleep 2
          done
          go run ./cmd/sre-agent investigate             --namespace golden-demo --deployment checkout-api             --incident-id inc-checkout-go-001 --summary 'checkout investigation'             --kube-api "$KUBE_API" --ca-file /tmp/sre-agent-ca.pem             --kube-token-file /tmp/sre-agent-reader.token             --prometheus http://127.0.0.1:19090             --out /tmp/sre-agent-checkout-evidence.json
          go run ./cmd/sre-agent verify-bundle --file /tmp/sre-agent-checkout-evidence.json
          # The alert here is a synthetic, offline webhook fixture; all three
          # Kubernetes/Prometheus observations below are live disposable-kind reads.
          # This proves plan/byte/identity linkage, not authenticated alert origin.
          cat > /tmp/sre-agent-alertmanager.json <<'ALERTJSON'
          {"status":"firing","groupKey":"golden-aiops:checkout-latency","commonLabels":{"cluster":"golden-aiops","namespace":"golden-demo","deployment":"checkout-api","severity":"sev2","alertname":"CheckoutLatency"},"commonAnnotations":{"summary":"checkout test alert"},"alerts":[{"status":"firing","fingerprint":"0123456789abcdef","labels":{"cluster":"golden-aiops","namespace":"golden-demo","deployment":"checkout-api"}}]}
          ALERTJSON
          go build -o /tmp/sre-agent ./cmd/sre-agent
          /tmp/sre-agent plan-alert \
            --file /tmp/sre-agent-alertmanager.json --cluster golden-aiops \
            --namespace golden-demo --deployment checkout-api \
            --out /tmp/sre-agent-alert-plan.json
          /tmp/sre-agent investigate-alert \
            --alert-file /tmp/sre-agent-alertmanager.json \
            --plan /tmp/sre-agent-alert-plan.json --cluster golden-aiops \
            --namespace golden-demo --deployment checkout-api \
            --kube-api "$KUBE_API" --ca-file /tmp/sre-agent-ca.pem \
            --kube-token-file /tmp/sre-agent-reader.token \
            --prometheus http://127.0.0.1:19090 \
            --query 'max(checkout_request_latency_seconds)' \
            --out /tmp/sre-agent-alert-evidence.json
          /tmp/sre-agent verify-bundle --file /tmp/sre-agent-alert-evidence.json
          python - <<'PY'
          import hashlib, json, pathlib
          raw = pathlib.Path('/tmp/sre-agent-alertmanager.json').read_bytes()
          plan = json.loads(pathlib.Path('/tmp/sre-agent-alert-plan.json').read_text())
          bundle = json.loads(pathlib.Path('/tmp/sre-agent-alert-evidence.json').read_text())
          assert plan['raw_sha256'] == hashlib.sha256(raw).hexdigest()
          assert plan['schema_version'] == 'sre.alert-plan/v1'
          assert plan['status'] == 'READ_ONLY_CANDIDATE'
          assert plan['source_authenticated'] is False
          assert plan['authorizes_execution'] is False
          assert bundle['incident']['incident_id'] == plan['incident_id']
          assert bundle['incident']['summary'] == plan['summary']
          assert bundle['incident']['severity'] == plan['severity']
          assert bundle['metadata']['observation_status'] == 'complete'
          assert len(bundle['evidence']) == 2 and not bundle['hypotheses']
          print('alert_readonly_evidence_consistent', plan['incident_id'])
          PY
          python - <<'PY'
          import json
          path = '/tmp/sre-agent-alert-plan.json'
          plan = json.load(open(path))
          plan['authorizes_execution'] = True
          with open('/tmp/sre-agent-tampered-plan.json', 'w') as f:
              json.dump(plan, f)
          PY
          set +e
          /tmp/sre-agent investigate-alert \
            --alert-file /tmp/sre-agent-alertmanager.json \
            --plan /tmp/sre-agent-tampered-plan.json --cluster golden-aiops \
            --namespace golden-demo --deployment checkout-api \
            --kube-api "$KUBE_API" --ca-file /tmp/sre-agent-ca.pem \
            --kube-token-file /tmp/sre-agent-reader.token \
            --prometheus http://127.0.0.1:19090 \
            --query 'max(checkout_request_latency_seconds)' \
            --out /tmp/sre-agent-invalid-alert-evidence.json
          FAIL_CLOSED=$?
          set -e
          test "$FAIL_CLOSED" -eq 3
          test ! -e /tmp/sre-agent-invalid-alert-evidence.json
          echo "PASS synthetic Alertmanager -> real read-only kind evidence / tamper UNKNOWN"
      - name: Upload disposable investigation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-readonly-kind-proof
          path: |
            /tmp/sre-agent-checkout-evidence.json
            /tmp/sre-agent-alertmanager.json
            /tmp/sre-agent-alert-plan.json
            /tmp/sre-agent-alert-evidence.json
            /tmp/sre-prometheus-pf.log
