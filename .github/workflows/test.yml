name: test

on:
  pull_request:
  push:
    branches: [main]
  # Independently validate the merged main tree, not an older PR head.
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Exact-commit Python test and evidence manifest
        run: |
          python scripts/verify_exact_tree.py \
            --repo . --expected-sha "${{ github.sha }}" \
            --scope python --expected-python "${{ matrix.python-version }}" \
            --out-dir "${{ runner.temp }}/sre-exact-python-${{ matrix.python-version }}"
      - name: Upload exact-commit Python proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-exact-python-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/sre-exact-python-${{ matrix.python-version }}/
          if-no-files-found: warn
      - name: Build and smoke-test a non-editable wheel
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/endpoint-wheel.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python -m pip wheel --no-deps --wheel-dir "$work/dist" .
          python -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --no-deps --no-index "$work"/dist/*.whl
          python scripts/verify_installed_endpoint.py --cli "$work/venv/bin/agentic-aiops"
