name: go-oracle-kind

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/oracle/**"
      - "cmd/sre-agent/evaluate_oracle.go"
      - "cmd/sre-agent/main.go"
      - "demo/go-oracle/**"
      - ".github/workflows/go-oracle-kind.yml"

permissions:
  contents: read

jobs:
  disposable-service-fault-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: golden-oracle
      - name: Execute live no-fault and Service targetPort-misroute episodes
        run: bash demo/go-oracle/run-kind.sh
      - name: Upload original independent fault and probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-oracle-kind-proof
          path: /tmp/go-oracle-proof/
