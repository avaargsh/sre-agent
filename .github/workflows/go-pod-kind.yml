name: go-pod-kind

on:
  pull_request:
    paths:
      - 'cmd/sre-agent/**'
      - 'internal/**'
      - 'demo/go-observe/pod-*'
      - '.github/workflows/go-pod-kind.yml'
      - 'go.mod'
  push:
    branches: [main]
    paths:
      - 'cmd/sre-agent/**'
      - 'internal/**'
      - 'demo/go-observe/pod-*'
      - '.github/workflows/go-pod-kind.yml'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pod-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: sre-pod-diagnosis
      - name: Pod diagnosis and native response contract
        run: go test -race ./internal/poddiagnosis ./internal/observe ./cmd/sre-agent
      - name: Real disposable-kind capture and replay
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash demo/go-observe/pod-kind.sh
      - name: Real disposable-kind Events List capture and verification
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash demo/go-observe/pod-events-kind.sh
