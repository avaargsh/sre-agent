apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-change-reader
  namespace: golden-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-change-reader
  namespace: golden-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-change-reader
  namespace: golden-demo
subjects:
  - kind: ServiceAccount
    name: sre-change-reader
    namespace: golden-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-change-reader
