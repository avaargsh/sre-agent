apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-dns-reader
  namespace: golden-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-dns-reader
  namespace: golden-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    resourceNames: ["dns-good", "dns-bad"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-dns-reader
  namespace: golden-demo
subjects:
  - kind: ServiceAccount
    name: sre-dns-reader
    namespace: golden-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-dns-reader
