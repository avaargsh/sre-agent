apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-endpoint-reader
  namespace: golden-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-endpoint-reader
  namespace: golden-demo
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["checkout-api"]
    verbs: ["get"]
  # Kubernetes RBAC cannot constrain LIST by Kubernetes labelSelector.
  # Restrict this lab identity to an ephemeral, isolated namespace.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-endpoint-reader
  namespace: golden-demo
subjects:
  - kind: ServiceAccount
    name: sre-endpoint-reader
    namespace: golden-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-endpoint-reader
