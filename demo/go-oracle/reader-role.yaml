apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-oracle-observer
  namespace: golden-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-oracle-observer
  namespace: golden-demo
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["checkout-api"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-oracle-observer
  namespace: golden-demo
subjects:
  - kind: ServiceAccount
    name: sre-oracle-observer
    namespace: golden-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-oracle-observer
