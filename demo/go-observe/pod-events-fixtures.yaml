apiVersion: v1
kind: ServiceAccount
metadata:
  name: events-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: events-reader
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: events-reader
subjects:
  - kind: ServiceAccount
    name: events-reader
    namespace: sre-events-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: events-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: crash
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36.1
      command: ["sh", "-c", "exit 42"]
