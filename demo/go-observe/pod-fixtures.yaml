apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["crash", "healthy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: sre-pod-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: crash
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36.1
      command: ["sh", "-c", "exit 42"]
---
apiVersion: v1
kind: Pod
metadata:
  name: healthy
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
